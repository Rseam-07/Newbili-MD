name: MD iOS preview
on:
  workflow_dispatch:
    inputs:
      live_smoke:
        description: Run the iPad simulator flow against live Bilibili APIs
        type: boolean
        default: false
  pull_request:
    paths:
      - AndroidFlutter/ios/**
      - AndroidFlutter/lib/main.dart
      - AndroidFlutter/lib/utils/update.dart
      - AndroidFlutter/test_driver/ios_smoke.dart
      - Scripts/build-md-ios.sh
      - .github/workflows/md-ios.yml
permissions:
  contents: read
concurrency:
  group: md-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: {flutter-version: 3.47.2, channel: stable, cache: true}
      - name: Prepare shared MD app
        env: {FLUTTER_BIN: '${{ env.FLUTTER_ROOT }}/bin/flutter'}
        run: |
          flutter config --no-enable-swift-package-manager
          Scripts/prepare-android-flutter.sh
      - name: Focused regression checks
        working-directory: AndroidFlutter
        run: flutter test --no-pub test/utils/update_version_test.dart test/widgets/onboarding_test.dart test/services/download_manager_test.dart test/utils/web_link_test.dart
      - name: Build simulator with signed native libraries
        env: {FLUTTER_BIN: '${{ env.FLUTTER_ROOT }}/bin/flutter'}
        run: Scripts/build-md-ios.sh simulator
      - name: Optional live iPad flow
        if: inputs.live_smoke == true
        env: {FLUTTER_BIN: '${{ env.FLUTTER_ROOT }}/bin/flutter'}
        run: |
          MD_IOS_TARGET=test_driver/ios_smoke.dart Scripts/build-md-ios.sh simulator
          device_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for v in d["devices"].values() for x in v if "iPad" in x["name"]))')"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcodebuild test -workspace AndroidFlutter/ios/Runner.xcworkspace -scheme Runner -configuration Debug -destination "platform=iOS Simulator,id=$device_id" -only-testing:RunnerUITests/RunnerUITests/testLandscapeLaunch -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/ios-smoke.xcresult" ONLY_ACTIVE_ARCH=YES
      - name: Build unsigned device IPA
        env: {FLUTTER_BIN: '${{ env.FLUTTER_ROOT }}/bin/flutter'}
        run: Scripts/build-md-ios.sh unsigned
      - uses: actions/upload-artifact@v7
        with:
          name: Newbili-MD-iOS-unsigned
          path: dist/*-iOS-unsigned.ipa
      - uses: actions/upload-artifact@v7
        if: always() && inputs.live_smoke == true
        with:
          name: iPad-live-smoke
          path: '${{ runner.temp }}/ios-smoke.xcresult'
